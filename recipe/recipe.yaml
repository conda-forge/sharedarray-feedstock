schema_version: 1

context:
  name: SharedArray
  version: "3.2.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b8b8d189110c023b9de502f9396ff2591f660fb2c9637eb13fcaf233127e50be

build:
  number: 4
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - numpy
  run:
    - python
    - pip

tests:
  - python:
      imports:
        - SharedArray
      pip_check: true

about:
  license: GPL-2.0-or-later
  license_file: LICENSE.txt
  summary: SharedArray python/numpy extension
  description: |
    This is a simple python extension that lets you share numpy arrays
    with other processes on the same computer. It uses either shared files
    or POSIX shared memory as data stores and therefore should work on
    most operating systems.
  homepage: https://gitlab.com/tenzing/shared-array
  repository: https://gitlab.com/tenzing/shared-array
  documentation: https://gitlab.com/tenzing/shared-array

extra:
  recipe-maintainers:
    - jan-janssen
